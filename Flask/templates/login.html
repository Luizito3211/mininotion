<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Mini Notion</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-100 text-zinc-900">
    <main class="flex min-h-screen items-center justify-center px-4">
      <section class="w-full max-w-md rounded-lg border border-zinc-200 bg-white p-6 shadow-sm">
        <div class="mb-6">
          <h1 class="text-2xl font-semibold">Mini Notion</h1>
          <p class="mt-1 text-sm text-zinc-500">Entre ou crie sua conta para acessar suas notas.</p>
        </div>

        <div id="auth-message" class="mb-4 hidden rounded-md px-3 py-2 text-sm"></div>

        <form id="auth-form" class="space-y-4">
          <div>
            <label for="email" class="mb-1 block text-sm font-medium">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="w-full rounded-md border border-zinc-300 px-3 py-2 text-sm outline-none focus:border-zinc-900"
            >
          </div>

          <div>
            <label for="password" class="mb-1 block text-sm font-medium">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full rounded-md border border-zinc-300 px-3 py-2 text-sm outline-none focus:border-zinc-900"
            >
          </div>

          <div class="flex gap-2">
            <button
              type="submit"
              data-auth-action="/login"
              class="flex-1 rounded-md bg-zinc-900 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-700"
            >
              Entrar
            </button>
            <button
              type="button"
              data-auth-action="/register"
              class="flex-1 rounded-md border border-zinc-300 px-4 py-2 text-sm font-medium hover:bg-zinc-50"
            >
              Cadastrar
            </button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const form = document.querySelector("#auth-form");
      const message = document.querySelector("#auth-message");
      let authAction = "/login";

      document.querySelectorAll("[data-auth-action]").forEach((button) => {
        button.addEventListener("click", () => {
          authAction = button.dataset.authAction;
          if (button.type === "button") {
            form.requestSubmit();
          }
        });
      });

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = `mb-4 rounded-md px-3 py-2 text-sm ${
          isError ? "bg-red-50 text-red-700" : "bg-emerald-50 text-emerald-700"
        }`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          email: form.email.value,
          password: form.password.value,
        };

        try {
          const response = await fetch(authAction, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            showMessage(data.error || "Nao foi possivel autenticar.", true);
            return;
          }

          showMessage(data.message || "Autenticado com sucesso.");
          window.location.href = "/";
        } catch (error) {
          showMessage("Erro de conexao com o servidor.", true);
        }
      });
    </script>
  </body>
</html>
