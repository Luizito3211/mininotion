<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notas | Mini Notion</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen overflow-hidden bg-white text-zinc-900">
    <div class="flex h-screen">
      <aside class="flex w-72 shrink-0 flex-col border-r border-zinc-200 bg-zinc-50">
        <header class="flex items-center justify-between border-b border-zinc-200 px-4 py-3">
          <h1 class="text-sm font-semibold">Mini Notion</h1>
          <a href="/logout" class="text-xs text-zinc-500 hover:text-zinc-900">Sair</a>
        </header>

        <div class="p-3">
          <button
            id="new-note-button"
            class="w-full rounded-md bg-zinc-900 px-3 py-2 text-left text-sm font-medium text-white hover:bg-zinc-700"
          >
            Nova nota
          </button>
        </div>

        <nav id="notes-list" class="flex-1 space-y-1 overflow-y-auto px-2 pb-3"></nav>
      </aside>

      <main class="flex min-w-0 flex-1 flex-col">
        <div id="empty-state" class="flex flex-1 items-center justify-center px-6 text-center">
          <div>
            <h2 class="text-xl font-semibold">Nenhuma nota selecionada</h2>
            <p class="mt-2 text-sm text-zinc-500">Crie ou selecione uma nota na barra lateral.</p>
          </div>
        </div>

        <section id="editor-panel" class="hidden flex-1 flex-col">
          <header class="flex items-center justify-end gap-2 border-b border-zinc-200 px-6 py-3">
            <span id="save-status" class="mr-auto text-xs text-zinc-500"></span>
            <button
              id="save-note-button"
              class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-medium hover:bg-zinc-50"
            >
              Salvar
            </button>
            <button
              id="delete-note-button"
              class="rounded-md border border-red-200 px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50"
            >
              Deletar
            </button>
          </header>

          <article class="mx-auto flex w-full max-w-4xl flex-1 flex-col px-8 py-8">
            <input
              id="note-title"
              class="w-full border-none text-4xl font-bold outline-none placeholder:text-zinc-300"
              placeholder="Titulo"
            >
            <textarea
              id="note-content"
              class="mt-6 min-h-0 flex-1 resize-none border-none text-base leading-7 outline-none placeholder:text-zinc-300"
              placeholder="Comece a escrever..."
            ></textarea>
          </article>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
